# GoReleaser Configuration
# https://goreleaser.com
version: 2

project_name: vpsctl

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: vpsctl
    main: ./cmd/vpsctl
    binary: vpsctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.date={{ .Date }}

archives:
  - id: default
    format: tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md
      - configs/*

dockers:
  - image_templates:
      - "ghcr.io/vpsctl/vpsctl:{{ .Version }}-amd64"
      - "ghcr.io/vpsctl/vpsctl:latest-amd64"
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.description=Secure, modern web panel for VPS management"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
    ids:
      - vpsctl

  - image_templates:
      - "ghcr.io/vpsctl/vpsctl:{{ .Version }}-arm64"
      - "ghcr.io/vpsctl/vpsctl:latest-arm64"
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.description=Secure, modern web panel for VPS management"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
    goarch: arm64
    ids:
      - vpsctl

docker_manifests:
  - name_template: "ghcr.io/vpsctl/vpsctl:{{ .Version }}"
    image_templates:
      - "ghcr.io/vpsctl/vpsctl:{{ .Version }}-amd64"
      - "ghcr.io/vpsctl/vpsctl:{{ .Version }}-arm64"

  - name_template: "ghcr.io/vpsctl/vpsctl:latest"
    image_templates:
      - "ghcr.io/vpsctl/vpsctl:latest-amd64"
      - "ghcr.io/vpsctl/vpsctl:latest-arm64"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  use: github
  groups:
    - title: "🚀 Features"
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: "🐛 Bug Fixes"
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: "📝 Documentation"
      regexp: '^.*?doc(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: "♻️ Refactor"
      regexp: '^.*?refactor(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: "📦 Dependencies"
      regexp: '^.*?(deps|build|ci)(\([[:word:]]+\))??!?:.+$'
      order: 4
    - title: "Other"
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: vpsctl
    name: vpsctl
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"
  header: |
    ## What's Changed
  footer: |
    **Full Changelog**: https://github.com/vpsctl/vpsctl/compare/{{ .PreviousTag }}...{{ .Tag }}
  extra_files:
    - glob: configs/*.yaml

announce:
  discord:
    enabled: false
